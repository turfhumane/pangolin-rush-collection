  <body>
    <div class="x-stage"><canvas id="game" width="424" height="240" tabindex="0" aria-label="Pangolin Rush game"></canvas></div>
    <script>
(function () {
  var W = 424, H = 240, L = 2560;

  addEventListener("resize", fit); fit();

  // ---------- input ----------
  var keys = {}, pressed = {}, cheatBuf = "", dbgBuf = "", dbgOK = false, dbgFx = 0, dk = {}, dp = {};
  var dbg = { on: false, i: 0, x: 0, y: 0, v: 0 };
  var MAP = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r", ArrowDown: "d", KeyS: "d",
    ArrowUp: "j", KeyW: "j", Space: "j", KeyZ: "j", Enter: "e", KeyX: "x", KeyK: "x", KeyM: "m", KeyP: "p", Escape: "p",
    KeyC: "c", ShiftLeft: "c", ShiftRight: "c" };

    }
    // DEBUG MODE keys: Q toggles in a level; while on, raw keys drive the cursor
    if (dbgOK && state === "play" && !paused && e.code === "KeyQ" && !e.repeat) { dbgToggle(); e.preventDefault(); return; }
    if (dbg.on) { if (!dk[e.code]) dp[e.code] = true; dk[e.code] = true; if (MAP[e.code] !== "p" && MAP[e.code] !== "m") { e.preventDefault(); return; } }

  });
  addEventListener("keyup", function (e) { dk[e.code] = false; var k = MAP[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
  addEventListener("pointerdown", function () { Music.unlock(); });
  document.addEventListener("visibilitychange", function () { Music.pause(); });

  // ---------- music: a tiny 16th-note step sequencer, scheduled ahead on the audio clock ----------
  // Song notation: note names ("C5", "F#4"), "_" holds the previous note, "." rests.
  // Drums: k kick, s snare, h hat, c/o high and low clip-clop, "." rest.
  var Music = (function () {
    var AC = window.AudioContext || window.webkitAudioContext, ac = null, master, mus, bus, noise;
    var cur = null, wanted = null, song = null, step = 0, nextT = 0, muted = false, held = false;
    var SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    function hz(n) { var m = /^([A-G])(#?)(\d)$/.exec(n); return 440 * Math.pow(2, (12 * (+m[3] + 1) + SEMI[m[1]] + (m[2] ? 1 : 0) - 69) / 12); }
    function parse(s) {
      var t = s.trim().split(/\s+/);
      return t.map(function (x, i) { if (x === "_" || x === ".") return 0; var n = 1; while (t[i + n] === "_") n++; return [hz(x), n]; });
    }
    function rep(s, n) { return new Array(n + 1).join(s + " "); }
    // bass bar helpers: bounce (root, octave, fifth), drive (8th chug), hold (whole note)
    function bounce(a, b, c) { return [a, ".", b, ".", c, ".", b, ".", a, ".", b, ".", c, ".", b, "."].join(" "); }
    function drive(a, b) { return [a, ".", a, b, a, ".", a, b, a, ".", a, b, a, ".", b, a].join(" "); }
    function hold(a, b) { return a + " _ _ _ _ _ _ _ " + b + " _ _ _ _ _ _ _"; }
    function S(bpm, lead, bass, drums, o) {
      o = o || {};
      return { bpm: bpm, lead: parse(lead), bass: parse(bass), drums: drums.replace(/\s/g, ""), loop: o.loop !== false,
        echo: o.echo, pluck: o.pluck, heavy: o.heavy, lv: o.lv || 0.22 };
    }
    var SONGS = {
      title: S(132,
        "C5 _ E5 G5 C6 _ _ _ B5 _ G5 _ A5 _ _ _ F5 _ A5 C6 D6 _ C6 _ B5 _ D6 _ G5 _ _ _",
        "C3 _ _ _ C3 _ G2 _ F2 _ _ _ F2 _ A2 _ F2 _ _ _ F2 _ A2 _ G2 _ _ _ G2 _ B2 _",
        "k.h.s.h.k.h.s.h. k.h.s.h.k.hss.ss"),
      seaside: S(150,
        "G5 _ B5 _ D6 _ B5 _ C6 B5 A5 _ G5 _ D5 _ E5 _ G5 _ B5 _ _ A5 G5 _ E5 _ F#5 _ G5 _ " +
        "E5 _ G5 _ C6 _ E6 _ D6 _ C6 _ B5 _ A5 _ F#5 _ A5 _ D6 _ _ _ C6 _ B5 _ A5 _ F#5 _",
        bounce("G2", "G3", "D3") + " " + bounce("E2", "E3", "B2") + " " + bounce("C3", "C4", "G3") + " " + bounce("D3", "D4", "A3"),
        "k.h.s.h.k.k.s.h. k.h.s.h.k.k.s.h. k.h.s.h.k.k.s.h. k.h.s.h.k.k.s.ss"),
      caverns: S(110,
        "A4 _ _ C5 E5 _ _ _ D5 _ C5 _ B4 _ _ _ C5 _ _ A4 F5 _ _ _ E5 _ _ _ C5 _ _ _ " +
        "D5 _ _ F5 A5 _ _ _ G5 _ F5 _ E5 _ D5 _ E5 _ _ _ G#5 _ B5 _ E6 _ _ _ D6 _ B5 _",
        hold("A2", "A2") + " " + hold("F2", "F2") + " " + hold("D2", "D3") + " " + hold("E2", "E2"),
        "k.......h...s... k.....h.h...s..h", { echo: true, lv: 0.18 }),
      factory: S(140,
        "E5 _ E5 . G5 _ E5 . B5 _ A5 _ G5 _ F#5 _ E5 _ E5 . G5 _ E5 . D6 _ C6 _ B5 _ _ _ " +
        "C6 _ B5 . A5 _ G5 . A5 _ B5 _ C6 _ E6 _ D6 _ C6 . B5 _ A5 . B5 _ _ _ D#5 _ F#5 _",
        drive("E2", "E3") + " " + drive("E2", "E3") + " " + drive("C2", "C3") + " " + drive("B1", "B2"),
        "k.hhs.hkk.hhs.hh k.hhs.hkk.hhs.hh k.hhs.hkk.hhs.hh k.hhs.hkk.s.s.ss", { heavy: true }),
      boss: S(170,
        "B4 C5 B4 . F5 _ E5 . B4 C5 B4 . D5 _ C#5 . B4 C5 B4 . F5 _ E5 . G5 _ F5 _ E5 _ D5 _",
        drive("B1", "B2") + " " + drive("C2", "C3"),
        "kkhsk.hsk.hskhss kkhsk.hsk.hsksss", { heavy: true }),
      raceway: S(160,
        "D5 . F#5 A5 D6 . A5 F#5 G5 . B5 . A5 . F#5 . E5 . G5 . B5 . A5 G5 F#5 . E5 . D5 . . . " +
        "A4 . C#5 E5 A5 . G5 E5 F#5 . E5 . D5 . C#5 . D5 . E5 F#5 G5 . A5 . F#5 . D5 . D5 . . .",
        "D3 . . . A2 . . . D3 . . . A2 . . . G2 . . . D3 . . . A2 . . . E3 . . . " +
        "A2 . . . E3 . . . A2 . . . C#3 . . . D3 . . . A2 . . . D3 . . . D3 . . .",
        rep("o.cco.cco.cco.cc", 4), { pluck: true }),
      // BONUS STAGE: bright plucked arpeggios over a bouncing bass
      bonus: S(168,
        "E5 . G#5 B5 E6 _ B5 . C#6 . E6 . F#6 _ E6 . D#6 . B5 . F#5 _ B5 . G#5 _ E5 . F#5 _ G#5 _ " +
        "A5 . C#6 E6 A6 _ E6 . B5 . D#6 . F#6 _ B5 . G#5 . B5 E6 G#6 _ F#6 . E6 _ . . E6 . . .",
        bounce("E2", "E3", "B2") + " " + bounce("C#3", "C#4", "G#3") + " " + bounce("A2", "A3", "E3") + " " + bounce("B2", "B3", "F#3"),
        "k.h.s.hhk.h.s.hh", { pluck: true, lv: 0.2 }),
      // PANGOLIN RUSH 3 zone themes: marimba jungle, synth city, soaring sky, and a new final-boss theme
      jungle: S(146,
        "E5 . G5 . A5 . G5 E5 D5 . E5 . G5 _ _ . A5 . C6 . D6 . C6 A5 G5 . A5 . E5 _ _ . " +
        "D5 . E5 G5 A5 . C6 . D6 . E6 . D6 C6 A5 . G5 . A5 . C6 . A5 G5 E5 . D5 . E5 _ _ .",
        bounce("A2", "A3", "E3") + " " + bounce("F2", "F3", "C3") + " " + bounce("G2", "G3", "D3") + " " + bounce("E2", "E3", "B2"),
        "o.cko.cco.cko.ck", { pluck: true, lv: 0.21 }),
      city: S(124,
        "C#5 _ E5 _ G#5 _ B5 _ A5 _ G#5 _ E5 _ _ _ F#5 _ A5 _ C#6 _ B5 _ A5 _ G#5 _ F#5 _ _ _ " +
        "E5 _ G#5 _ B5 _ E6 _ D#6 _ C#6 _ B5 _ G#5 _ A5 _ B5 _ C#6 _ B5 _ A5 _ G#5 _ _ _ _ _",
        drive("C#2", "C#3") + " " + drive("A1", "A2") + " " + drive("E2", "E3") + " " + drive("B1", "B2"),
        "k.h.s.hhk.hks.hh", { echo: true, lv: 0.17 }),
      sky: S(158,
        "D5 _ A5 _ D6 _ C#6 B5 A5 _ F#5 _ G5 _ A5 _ B5 _ G5 _ E5 _ F#5 G5 A5 _ _ _ _ _ _ _ " +
        "B5 _ F#5 _ D6 _ C#6 _ B5 _ A5 _ G5 _ F#5 _ E5 _ F#5 _ G5 _ A5 _ D6 _ _ _ D6 . E6 .",
        bounce("D3", "D4", "A3") + " " + bounce("G2", "G3", "D3") + " " + bounce("B2", "B3", "F#3") + " " + bounce("A2", "A3", "E3"),
        "k.h.s.h.k.hks.hh", {}),
      final: S(180,
        "A4 A4 C5 . A4 D5 . C5 A4 A4 E5 . D5 C5 B4 . A4 A4 C5 . A4 F5 . E5 D5 C5 B4 C5 D5 _ E5 _",
        drive("A1", "A2") + " " + drive("F1", "F2"),
        "kkhskkhsk.hskshs kkhskkhsk.hsksss", { heavy: true, lv: 0.2 }),
      clear: S(150,
        "C5 E5 G5 C6 _ . G5 . C6 _ _ _ _ _ _ _",
        "C3 _ _ _ _ _ G2 _ C3 _ _ _ _ _ _ _",
        "k.....s.k.......", { loop: false }),
      win: S(140,
        "G4 _ C5 _ E5 _ G5 _ E5 _ G5 _ C6 _ _ _ A5 _ F5 _ A5 _ C6 _ D6 _ B5 _ G5 _ _ _ " +
        "C6 _ G5 _ E5 _ G5 _ C6 _ E6 _ C6 _ _ _ _ _ _ _",
        "C3 _ _ _ G2 _ _ _ C3 _ _ _ E3 _ _ _ F2 _ _ _ A2 _ _ _ G2 _ _ _ G2 _ _ _ " +
        "C3 _ _ _ G2 _ _ _ C3 _ _ _ _ _ _ _ _ _ _ _",
        "k.h.s.h.k.h.s.h. k.h.s.h.k.hss.ss k.h.s.h.k.....s.....", { loop: false }),
      over: S(90,
        "G4 _ _ F4 _ _ E4 _ _ D#4 _ _ D4 _ _ _ _ _ C4 _ _ _ _ _",
        "C3 _ _ _ _ _ B2 _ _ _ _ _ A#2 _ _ _ _ _ A2 _ _ _ _ _",
        "", { loop: false })
    };
    function tone(type, f, t, d, v, pluck) {
      var o = ac.createOscillator(), g = ac.createGain();

      g.gain.linearRampToValueAtTime(v, t + 0.006);
      if (pluck) g.gain.exponentialRampToValueAtTime(0.001, t + Math.min(d, 0.14));
      else { g.gain.setValueAtTime(v * 0.75, t + d * 0.7); g.gain.linearRampToValueAtTime(0.0001, t + d * 0.95); }
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + 0.05);

    function drum(c, t, heavy) {

        g.gain.setValueAtTime(heavy ? 1 : 0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + 0.02);

      } else if (c === "s") burst(t, heavy ? 0.16 : 0.11, heavy ? 0.6 : 0.45, "bandpass", 1800);
      else if (c === "h") burst(t, 0.035, 0.22, "highpass", 7000);

    }
    function play(i, t) {
      var sp = 60 / song.bpm / 4, L = song.lead[i], B = song.bass[i], D = song.drums.charAt(i % (song.drums.length || 1));
      if (L) {

    function pump() {
      if (!ac || !song) return;

      while (song && nextT < ac.currentTime + 0.1) {

    function start(name) {
      cur = name;
      if (bus) { var old = bus; old.gain.setTargetAtTime(0, ac.currentTime, 0.03); setTimeout(function () { old.disconnect(); }, 300); }
      bus = ac.createGain(); bus.connect(mus);

      // the pause key and a hidden tab both stop the audio clock; the song picks up where it left off
      pause: function (on) {

  // ---------- level ----------
  // PANGOLIN RUSH 3: three brand-new zones, three acts each; Act 3 of every zone ends in a brand-new boss.
  // Every zone has its own look, terrain shape, gimmick and enemy set. Acts are seeded, so each is the same every play.
  var ZONES = [
    { name: "CANOPY CASCADE", song: "jungle", theme: "jungle", amp: 1.5,
      boss: { kind: "totem", hp: 5, name: "THORN TOTEM" },
      pool: ["run", "pit", "tiers", "mover", "box", "wasp", "spike", "mover", "tiers", "spring"],
      pal: { sky: ["#3fb5c9", "#d4f5c8"], cloud: ["#ffffff", "#e0f6e8"], isle: "#6fae86", sea: "#2a8fb0", wave: ["#9ff3ff", "#4fd0e0"],
        top: ["#4cc04a", "#3aa83a"], dirt: ["#77745a", "#66634b"], hi: "#b8f08a" } },
    { name: "NEON NIGHTWAY", song: "city", theme: "city", amp: 0.35,
      boss: { kind: "drone", hp: 6, name: "BASS DROPPER" },
      pool: ["run", "boost", "pit", "box", "wasp", "spike", "boost", "spring", "boost", "spike"],
      pal: { sky: ["#0b0a2a", "#3a1a5e"], cloud: ["#3a2a6a", "#2a1e50"], isle: "#1c1840", sea: "#120f26", wave: ["#ff4ad8", "#38e8ff"],
        top: ["#d8d8e4", "#c4c4d2"], dirt: ["#2e2c3c", "#282634"], hi: "#ffffff" } },
    { name: "SKYWARD CITADEL", song: "sky", theme: "sky", amp: 1,
      boss: { kind: "roc", hp: 8, name: "STORM ROC", final: true },
      pool: ["run", "updraft", "lift", "box", "wasp", "mover", "spike", "spring", "updraft", "pit"],
      pal: { sky: ["#3b2a7a", "#ffa47a"], cloud: ["#ffe6f0", "#f3c4dc"], isle: "#8a6ab8", sea: "#f6e8ff", wave: ["#ffffff", "#f3d4ec"],
        top: ["#ffffff", "#f1e6ff"], dirt: ["#e6daf4", "#d6c6ec"], hi: "#ffd23f" } }
  ];
  // shared terrain: zone amplitude, flattened into a level floor just before a boss arena
  function terr(x, hp, amp, flat) {
    var a = amp;
    if (flat && x > flat) a *= Math.max(0.1, 1 - (x - flat) / 140);
    return 175 + a * (14 * Math.sin(x * 0.011 + hp) + 7 * Math.sin(x * 0.029 + 1 + hp));
  }
  function actRand(seed) { return function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }
  function makeAct(z, a) {
    var Z = ZONES[z], R = actRand(7919 + z * 1013 + a * 271), isBoss = a === 2;
    var len = isBoss ? 2560 : 9200 + a * 1000 + z * 600, end = isBoss ? 1900 : len - 380, hp = z * 2.1 + a * 0.9 + 3;
    var d = { tag: "ZONE " + (z + 1) + " ACT " + (a + 1), name: Z.name, zi: z, act: a, hp: hp, len: len, pal: Z.pal,
      theme: Z.theme, amp: Z.amp, flat: isBoss ? len - 424 - 150 : 0, song: Z.song,
      pits: [], ceils: [], plats: [], movers: [], boosts: [], ramps: [], fans: [], springs: [], spikes: [], boxes: [], beetles: [], waspers: [],
      rows: [], cols: [], ceilRows: [], checks: [40], boss: isBoss ? Z.boss : null, gate: null };
    function H(x) { return terr(x, hp, Z.amp, d.flat); }
    var diff = z + a * 0.6, x = 240, n = 0, lastCk = 40, ceilN = 0, maxCeil = isBoss ? 1 : 2, upUsed = false, pool = Z.pool, prevT = "";
    while (x < end) {
      if (x - lastCk > 850) { d.checks.push(x); lastCk = x; x += 50; }
      var t = pool[Math.floor(R() * pool.length)];
      if (n === 2 || (n > 2 && !d.springs.length && n !== 3 && n !== 8)) t = "spring";
      if (t === "spring" && (n === 3 || n === 8)) t = "run";
      else if ((n === 4 || n === 9) && ceilN < maxCeil) t = "ceil";
      // never put a gap straight after a spring launch
      if (prevT === "spring" && ["pit", "mover", "lift", "updraft", "boost"].indexOf(t) >= 0) t = "run";
      // nothing wide may spill into a boss arena
      if (isBoss && x + 560 > len - 424 && t !== "spring") t = R() < 0.5 ? "run" : "box";
      var w = 0;
      d.rows.push([x + 4, 3, 16]);
      if (t === "run") {
        d.rows.push([x + 10, 5, 18]);
        d.beetles.push([x + 150, x + 100, x + 220]);
        if (diff > 1.5 && R() < 0.5) d.beetles.push([x + 200, x + 160, x + 250]);
        w = 280;
      } else if (t === "pit") {
        var pw = Math.min(100, 60 + Math.floor(R() * 20) + Math.floor(diff * 6)), p0 = x + 90;
        d.pits.push([p0, p0 + pw]);
        var py = Math.round(Math.min(H(p0), H(p0 + 64)) - 30 - R() * 10);
        d.plats.push([p0 + 3, py, 64]);
        d.rows.push([p0 + 11, 3, 22, py - 14]);
        if (diff >= 1 && R() < 0.5) d.waspers.push([p0 + pw / 2, py - 40]);
        w = pw + 190;
      } else if (t === "box") {
        var bt = !upUsed && n > 5 ? "u" : ["s", "h", "f", "i", "s", "h"][Math.floor(R() * 6)];
        if (bt === "u") upUsed = true;
        d.boxes.push([x + 50, bt]); d.rows.push([x + 80, 4, 16]);
        w = 170;
      } else if (t === "wasp") {
        d.waspers.push([x + 90, Math.round(H(x + 90) - 52 - R() * 26)]);
        d.rows.push([x + 40, 6, 16]);
        w = 200;
      } else if (t === "spike") {
        var sw = R() < 0.4 + diff * 0.15 ? 24 : 16;
        d.spikes.push([x + 60, sw]); d.rows.push([x + 52, 3, 14, Math.round(H(x + 60) - 56)]);
        if (diff >= 2 && R() < 0.5) { d.spikes.push([x + 150, 16]); w = 230; } else w = 170;

        d.springs.push(x + 50); d.cols.push(x + 50);

        items.push({ z: z, t: "w", ax: ax, sd: sd });

          for (var tries = 0; tries < 20; tries++) {
            a = rp(0.6);
            if (ms.every(function (m) { return Math.hypot(m[0] - a[0], m[1] - a[1]) > 0.45; })) break;

          hoop(z + 60 + i * 110, a[0], a[1]);

        z += 5 * 45 + 230;
      } else if (k < 0.9) {

          hoop(z + r2 * 150, 0, 0);

        z += 300 + 200;
      } else {

  }
  function specialStep() {
    var S = SP; S.t++;
    S.pops = S.pops.filter(function (u) { u.y -= 0.7; return --u.t > 0; });
    S.rot += 0.004 + 0.004 * Math.sin(S.t * 0.005);
    if (S.end) { if (!--S.end) state = "sresult"; return; }
    if (S.t < 100) return;
    var ax = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ay = (keys.d ? 1 : 0) - (keys.j ? 1 : 0);
    S.vx = (S.vx + ax * 0.013) * 0.86; S.vy = (S.vy + ay * 0.013) * 0.86;
    S.x += S.vx; S.y += S.vy;

    S.v = 3.3 + 1 * S.d / SPEND;
    S.d += S.v * (S.hitT > 25 ? 0.6 : 1);

    function sy(y) { return H / 2 + 8 + y * TR; }

      if (it.got || it.z > S.d || it.z <= od) return;
      if (it.t === "h") {
        if (Math.hypot(S.x - it.x, S.y - it.y) < 0.32) {
          it.got = true; S.hoops++; S.chain++; S.best = Math.max(S.best, S.chain);
          var bonus = S.chain >= 5 ? 50 : 20; score += bonus;
          S.pops.push({ x: sx(it.x), y: sy(it.y) - 12, t: 26, s: S.chain >= 5 ? "x" + S.chain : "+1", c: S.chain >= 5 ? "#ffd23f" : "#fff2a0" });
        } else { it.got = true; it.miss = true; S.chain = 0; }
      } else if (S.hitT) {
        it.got = true;
      } else {
        var hit = it.t === "m" ? Math.hypot(S.x - it.x, S.y - it.y) < 0.13 : (it.ax === "h" ? S.y : S.x) * it.sd > 0.1;

  function tproj(r) { return TF / (TF + Math.max(r, -TF * 0.5)); }

  }
  function drawSpecial() {
    var S = SP, i, j, cx = W / 2, cy = H / 2 + 8;

    bg.addColorStop(0, "#fff6d0"); bg.addColorStop(0.08, "#ff8cff"); bg.addColorStop(0.35, "#3a1670"); bg.addColorStop(1, "#070318");

    for (j = 26; j >= 0; j--) {
      var za = z0 + j * SEG, r = za - S.d; if (r < -40) continue;
      var k = tproj(r), idx = Math.round(za / SEG), rot = S.rot + za * 0.0009;
      hexPath(cx, cy, TR * 1.25 * k, rot);
      ctx.strokeStyle = "hsla(" + ((idx * 37) % 360) + ",90%," + (idx & 1 ? 65 : 55) + "%," + Math.min(1, 0.25 + k * 0.9).toFixed(2) + ")";
      ctx.lineWidth = Math.max(1, 3 * k); ctx.stroke();

        for (i = 0; i < 6; i++) {
          var a = rot + i * Math.PI / 3;
          ctx.strokeStyle = "rgba(255,200,255,0.25)"; ctx.lineWidth = 1; ctx.beginPath();

    }
    // hoops, mines and laser walls, far first
    for (i = S.items.length - 1; i >= 0; i--) {
      var it = S.items[i], rz = it.z - S.d;
      if ((it.got && !it.miss) || rz < -30 || rz > 1700) continue;
      if (it.got && rz < 0) continue;

      ctx.globalAlpha = fade;

        ctx.fillStyle = on ? "rgba(255,40,90,0.45)" : "rgba(255,90,140,0.35)";

    text("HOOPS", 8, 28, 9, "#ffd23f"); text(S.hoops + " / " + S.target, 50, 28, 9, good ? "#4ade80" : "#fff");

      lines.push(shards >= 7 ? "ALL 7 SHARDS!  C / SHIFT + 50 SPARKS = PRISM FORM" : shards + " OF 7 PRISM SHARDS");
