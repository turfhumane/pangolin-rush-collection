    if (state === "select") {
      if (pressed.l || pressed.tl) { sel = (sel + CH.length - 1) % CH.length; snd("tick"); }
      if (pressed.r || pressed.tr) { sel = (sel + 1) % CH.length; snd("tick"); }
      if (pressed.u && maxZone > 0) { zi = (zi + 1) % (maxZone + 1); snd("tick"); }
      if (pressed.dn && maxZone > 0) { zi = (zi + maxZone) % (maxZone + 1); snd("tick"); }

      if (pressed.e || pressed.j) { if (sel === 4 && !unlocked) { lockMsg = 90; snd("no"); } else { ch = sel; startGame(zi); } }
      else if (pressed.esc) state = "controls";
      return;
    }
    if (state === "results") { if (goal) goal.spin += 0.05; if (pressed.e) { if (spGo) { spGo = false; startSpecial(zi); } else continueRun(); } return; }
    if (state === "special" || state === "final") {
      if (pressed.p || pressed.esc) paused = !paused;
      if (paused) return;
      if (shake) shake--;
      if (state === "special") stepSpecial(); else stepFinal();
      return;
    }
    if (state === "spresult") { if (pressed.e) { if (retPos) returnFromSpecial(); else continueRun(); } return; }
    if (state === "secret") { if (pressed.e) startFinal(); return; }
    if (state === "over" || state === "ending" || state === "trueend") { if (pressed.e) { state = "title"; titleT = 0; zi = 0; SP = null; FB = null; retPos = null; buildLevel(); snd("ok"); } return; }
