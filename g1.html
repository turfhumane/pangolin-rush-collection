    <script>
(function () {
  var W = 424, H = 240, L = 2560;

  // ---------- input ----------
  var keys = {}, pressed = {}, cheatBuf = "";
  var MAP = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r", ArrowDown: "d", KeyS: "d",
    ArrowUp: "j", KeyW: "j", Space: "j", KeyZ: "j", Enter: "e", KeyX: "x", KeyK: "x", KeyM: "m", KeyP: "p", Escape: "p",

  addEventListener("keydown", function (e) {

    if (state === "title" && /^Key[A-Z]$/.test(e.code) && !e.repeat) {

      if (cheatBuf === "PRISM") { cheat = true; shards = 7; cheatBuf = ""; e.preventDefault(); return; }
    }

  // ---------- music: a tiny 16th-note step sequencer, scheduled ahead on the audio clock ----------
  // Song notation: note names ("C5", "F#4"), "_" holds the previous note, "." rests.
  // Drums: k kick, s snare, h hat, c/o high and low clip-clop, "." rest.
  var Music = (function () {
    var AC = window.AudioContext || window.webkitAudioContext, ac = null, master, mus, bus, noise;
    var cur = null, wanted = null, song = null, step = 0, nextT = 0, muted = false, held = false;
    var SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    function hz(n) { var m = /^([A-G])(#?)(\d)$/.exec(n); return 440 * Math.pow(2, (12 * (+m[3] + 1) + SEMI[m[1]] + (m[2] ? 1 : 0) - 69) / 12); }
    function parse(s) {

    function tone(type, f, t, d, v, pluck) {

      if (it.t === "o") {
        var oy = P.y - 9 * s + Math.sin(S.t * 0.15 + i) * 2 * s;
        circ("rgba(80,170,255,0.3)", x, oy, 10 * s); circ("#2f7bff", x, oy, 6.5 * s); circ("#9ee0ff", x - 2 * s, oy - 2 * s, 2.5 * s);
      } else {
        var by = P.y - 8 * s;
        ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(x, P.y, 9 * s, 2.5 * s, 0, 0, 7); ctx.fill();
        circ("#1a1a22", x, by, 8 * s); circ("#4a4a58", x - 2.5 * s, by - 2.5 * s, 2.5 * s);
        rect("#8a7a5a", x + 3 * s, by - 10 * s, Math.max(1, 2 * s), 4 * s);
        circ((S.t >> 2) & 1 ? "#ffd23f" : "#ff4a2a", x + 4 * s, by - 11 * s, 2.2 * s);
      }
    }
    // the runner
    var px = W / 2 + (S.lx - 1) * LW, py = H - 24 + S.jy;
    if (!(S.hitT && (S.hitT >> 2) & 1)) {
      ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(px, H - 24, 11 + S.jy * 0.1, 3, 0, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(px, py); ctx.scale(1.5, 1.5);
      if (S.jy < 0) {
        circ(BALL[ch], 0, -8, 8); ctx.strokeStyle = BALL2[ch]; ctx.lineWidth = 1.5;
        for (i = 0; i < 3; i++) { var a = S.t * 0.4 + i * 2.09; ctx.beginPath(); ctx.arc(0, -8, 5.5, a, a + 1.2); ctx.stroke(); }
      } else {
        var run = Math.sin(S.t * 0.5) * 2;
        figOf(ch, 0, 0, 1, run, false);
      }
      ctx.restore();
    }
    S.pops.forEach(function (u) { text(u.s, u.x, u.y, 10, u.c, "center"); });
    // HUD
    var good = S.orbs >= S.target;
    text("BONUS STAGE", 8, 14, 9, "#ff8cff");
    text("BLUE ORBS", 8, 28, 9, "#9ee0ff"); text(S.orbs + " / " + S.target, 74, 28, 9, good ? "#4ade80" : "#fff");
    gems(W - 78, 12, shards);
    var bw = 140, bx = W / 2 - bw / 2;
    rect("rgba(0,0,0,0.5)", bx - 1, 39, bw + 2, 6); rect("#ff8cff", bx, 40, bw * Math.min(1, S.d / SPEND), 4);
    if (S.t < 100) {
      text("BONUS STAGE", W / 2, 110, 18, "#ffd23f", "center");
      text("COLLECT " + S.target + " BLUE ORBS FOR A PRISM SHARD", W / 2, 128, 9, "#fff", "center");
      text("\u2190 \u2192 SWITCH LANE   \u00b7   SPACE JUMP BOMBS", W / 2, 142, 9, "#9ee0ff", "center");
      if (S.t > 40) text(String(Math.ceil((100 - S.t) / 20)), W / 2, 172, 22, "#ffd23f", "center");
    }
    if (S.hitT > 30) { ctx.fillStyle = "rgba(255,40,40," + ((S.hitT - 30) / 60).toFixed(2) + ")"; ctx.fillRect(0, 0, W, H); }
    if (state === "sresult") {
      var lines = ["BLUE ORBS " + S.orbs + " / " + S.target];
      if (S.won) lines.push("YOU GOT THE " + SHARD_NAME[shards - 1] + " PRISM SHARD!");
      else lines.push(shards >= 7 ? "ALL 7 SHARDS ALREADY FOUND" : "NO SHARD THIS TIME");
      lines.push(shards >= 7 ? "ALL 7 SHARDS!  C / SHIFT + 50 SPARKS = PRISM FORM" : shards + " OF 7 PRISM SHARDS");
      lines.push("SCORE " + score);
      lines.push(S.from === "mid" ? "PRESS ENTER TO RETURN" : zone < LEVELS.length - 1 ? "PRESS ENTER FOR " + LEVELS[zone + 1].tag : "PRESS ENTER");
      overlay(S.won ? "SHARD GET!" : "STAGE OVER", lines);
      gems(W / 2 - 33, 204, shards);
    }
  }

  // ---------- fixed-step loop ----------
  var STEP = 1000 / 60, acc = 0, last = performance.now();
  function loop(now) {
    acc += Math.min(250, now - last); last = now;
    while (acc >= STEP) { update(); pressed = {}; acc -= STEP; }
    Music.want(songFor());
    ctx.save();
    if (shake && state === "play") ctx.translate(Math.round((Math.random() - 0.5) * shake * 0.5), Math.round((Math.random() - 0.5) * shake * 0.5));
    draw();
    ctx.restore();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
