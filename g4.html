      txt(Z.n + " DEFEATED!", mx, 70, 18, "hsl(" + (tick * 4 % 360) + ",100%,65%)", "center");
      txt("SCORE " + score, mx, 100, 12, "#ffffff", "center");
      if (newUnlock) txt("NOVA UNLOCKED!", mx, 130, 14, "hsl(" + (tick * 6 % 360) + ",100%,65%)", "center");
      txt("PRESS ENTER: BACK TO THE WORLD MAP", mx, 210, 10, blink ? "#9ee0ff" : "#ffffff", "center");
    }
    if (state === "ending") {
      dim(0.65);
      txt("NEBULA KING DEFEATED!", mx, 80, 20, "hsl(" + (tick * 4 % 360) + ",100%,65%)", "center");
      txt(CH[ch].n + " CONQUERED FROST, FIRE AND STARLIGHT", mx, 108, 11, "#ffffff", "center");
      txt("FINAL SCORE " + score, mx, 134, 14, "#ffd23f", "center");
      txt("ULTRA SHARDS " + shardCount() + "/3", mx, 160, 10, "#ffd23f", "center");
      txt("Collect all 3 Ultra Shards to face the secret final boss...", mx, 176, 8, "#9ee0ff", "center");
      txt("PRESS ENTER", mx, 210, 10, blink ? "#9ee0ff" : "#ffffff", "center");
    }
    if (state === "secret") {
      dim(0.6);
      txt("THE 3 ULTRA SHARDS ARE GLOWING...", mx, 70, 13, "hsl(" + (tick * 6 % 360) + ",100%,70%)", "center");
      txt("The Nebula King's crown cracks open... an ECLIPSE SERPENT swallows the sun!", mx, 96, 8, "#ffffff", "center");
      txt(CH[ch].n + " GOES ULTRA TO CHASE IT", mx, 120, 12, "#ffd23f", "center");
      txt("PRESS ENTER", mx, 210, 10, blink ? "#9ee0ff" : "#ffffff", "center");
    }
    if (state === "over") { dim(0.6); txt("GAME OVER", mx, 110, 22, "#ff5050", "center"); txt("SCORE " + score + "    PRESS ENTER", mx, 136, 10, "#ffffff", "center"); }
    if (paused) { dim(0.5); txt("PAUSED", mx, 115, 20, "#ffd23f", "center"); txt("P TO RESUME", mx, 136, 10, "#ffffff", "center"); }
    if (muted) txt("MUTED", VW - 8, 206, 8, "#aaaaaa", "right");
  }

  // ---------------------------------------------------------------- main loop (fixed 60 fps steps)
  buildLevel(); p = newPlayer({ x: 0, y: 0, z: 3, h: 0 });
  var last = 0, acc = 0, STEP = 1000 / 60;
  function loop(now) {
    if (!last) last = now;
    acc += Math.min(100, now - last); last = now;
    while (acc >= STEP) { update(); pressed = {}; acc -= STEP; }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
